worker_processes  1;
events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  yatharthpandey.dpdns.org localhost;

        root /data/data/com.termux/files/usr/share/nginx/html;
        index index.html;

        location /api/v1/ {
            proxy_pass http://127.0.0.1:8000/api/v1/;
            # Forward the caller's real Host and scheme so the backend builds any
            # redirect/absolute URL from the public domain, never 127.0.0.1.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Preserve the scheme the client actually used. Behind a TLS-terminating
            # tunnel (cloudflared) the edge already sent X-Forwarded-Proto: https;
            # nginx's own $scheme would wrongly read http there. Direct access falls
            # back to uvicorn's own scheme (http) when this header is absent.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
