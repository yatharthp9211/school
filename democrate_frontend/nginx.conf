worker_processes  1;
events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  yatharthpandey.dpdns.org localhost;

        root /data/data/com.termux/files/usr/share/nginx/html;
        index index.html;

        location /api/v1/ {
            proxy_pass http://127.0.0.1:8000/api/v1/;
            # Forward the caller's real Host and scheme so the backend builds any
            # redirect/absolute URL from the public domain, never 127.0.0.1.
            # $host/$scheme auto-adapt to localhost, IP, or public-domain access.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        location / {
            try_files $uri $uri/ /index.html;
            # Always revalidate static files (HTML/JS/CSS). Combined with the
            # ?v=N cache-busters in index.html, browsers fetch fresh code on
            # every deploy instead of serving stale cached JS (the cause of the
            # "Network error" after the API_BASE change).
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
